[package]
name = "drew"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[lints.rust]
unsafe_code = "forbid"
# Every public item says what its type cannot: units, invariants, errors, which step builds it.
missing_docs = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
bare_urls = "deny"

[lints.clippy]
# `Halted` carries the whole trace by design; halting is the rare path.
result_large_err = "allow"
# A panic outside tests states its invariant: `expect("...")`, never a bare `unwrap()`. Tests are exempt (clippy.toml).
unwrap_used = "deny"
# Unfinished or debugging code does not land.
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# A `std` lock guard held across `.await` blocks the runtime thread and can deadlock it.
await_holding_lock = "deny"
# A parameter that is only read is borrowed. `avoid-breaking-exported-api = false` (clippy.toml) extends this to `pub` fns.
needless_pass_by_value = "deny"
# `Arc::clone(&x)` marks the cheap clones, so every remaining `.clone()` is a deep copy worth reading.
clone_on_ref_ptr = "deny"

[dependencies]
async-trait = "0.1.92"
aws-config = { version = "1.12.0", features = ["behavior-version-latest"] }
# Without default features: the default `rustls` feature is the legacy hyper 0.14 / rustls 0.21 client.
aws-sdk-bedrockruntime = { version = "1.148.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
# Names `Document`, the JSON type of Bedrock tool schemas and tool-use input; the SDK does not re-export it.
aws-smithy-types = "1.8.1"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
hex = "0.4.3"
pgvector = { version = "0.4.2", features = ["sqlx"] }
reqwest = { version = "0.13.5", features = ["json", "query", "form"] }
tokio-tungstenite = { version = "0.26.2", features = ["rustls-tls-webpki-roots"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.27.0", features = ["v7", "serde"] }
indicatif = "0.18.6"
console = "0.16.6"
eros = "0.8.1"

[features]
# The fakes in `*/fakes.rs`, for integration tests; release builds leave them out.
testing = []

[dev-dependencies]
drew = { path = ".", features = ["testing"] }
http-body-util = "0.1.5"
# Paused time, so timeout and backoff tests run without real sleeps.
tokio = { version = "1.53.2", features = ["test-util"] }
tower = { version = "0.5.3", features = ["util"] }
wiremock = "0.6.5"
